name: Publish static data

# Publishes packages/data/registry/ to GitHub Pages so installed apps can pick up newly added
# county parcel services without an app release. Free for public repositories.
on:
  push:
    branches: [main]
    paths: ['packages/data/registry/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate registry JSON
        run: node -e "const r=require('./packages/data/registry/parcel-endpoints.json'); if(!Array.isArray(r.endpoints)) process.exit(1); console.log(r.endpoints.length+' endpoints')"
      - run: mkdir -p site/registry && cp packages/data/registry/*.json site/registry/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
